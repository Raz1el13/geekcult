{% extends "base.html" %}
{% block title %}Печать QR — ГикКульт{% endblock %}

{% block content %}

<div class="flex between wrap mb-3" style="margin-bottom:24px;gap:12px">
    <h1 class="page-title" style="margin-bottom:0">Печать QR-кодов</h1>
    <button class="btn btn-primary no-print" onclick="window.print()">Распечатать</button>
</div>

<p class="muted no-print" style="margin-bottom:24px">
    Все QR-коды на одной странице. Распечатай и наклей на предметы.
</p>

<div class="qr-grid">
    {% for item in items %}
    <div class="qr-card">
        <img src="{{ url_for('main.qr_image', item_id=item.id) }}" class="qr-img" alt="QR">
        <p class="qr-name">{{ item.name }}</p>
        <p class="qr-status">{{ item.status }}</p>
        <p class="qr-id">ID: {{ item.id }}</p>
    </div>
    {% endfor %}
</div>

<style>
.qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    align-items: stretch;
}
.qr-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
}
.qr-img {
    background:#fff;
    padding:8px;
    border-radius:10px;
    width: 140px;
    height: 140px;
    display: block;
    flex-shrink: 0;
}
.qr-name {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
    margin-top: 10px;
    /* фиксируем 2 строки, чтобы карточки были одной высоты */
    height: 32px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.qr-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
}
.qr-id {
    font-size: 10px;
    color: var(--muted);
    margin-top: auto;
    padding-top: 6px;
}

@media print {
    nav, .no-print, .page-title { display: none !important; }
    body { background: #fff !important; background-image: none !important; }
    .qr-card { background: #fff !important; }
    .qr-name { color: #000 !important; }
    .qr-status, .qr-id { color: #555 !important; }
    .container { padding: 0; }
    .qr-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .qr-card { border: 1px solid #ccc; break-inside: avoid; page-break-inside: avoid; }
    .qr-img { width: 120px; height: 120px; }
}
</style>

{% endblock %}
