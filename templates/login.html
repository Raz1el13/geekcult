{% extends "base.html" %}
{% block title %}Вход — ГикКульт{% endblock %}
{% block content %}
<div class="gc-auth">
    <div class="card">
        <div class="card-body">
            <h1>Вход</h1>
            <p class="gc-sub">Рады видеть вас снова</p>

            <form method="POST" action="{{ url_for('main.login', next=request.args.get('next')) }}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username or '' }}" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
                    <label class="form-check-label" for="remember">Запомнить меня</label>
                </div>

                <button type="submit" class="btn btn-gc w-100">Войти</button>
            </form>

            <p class="text-muted mt-4 mb-0 text-center" style="font-size:.9rem">
                Нет аккаунта? <a href="{{ url_for('main.register') }}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
