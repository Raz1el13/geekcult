{% extends "base.html" %}
{% block title %}Регистрация — ГикКульт{% endblock %}
{% block content %}

<div style="max-width:440px;margin:40px auto">
    <div class="card">
        <h1 style="font-size:24px;font-weight:800;margin-bottom:6px">Регистрация</h1>
        <p class="muted" style="margin-bottom:24px">Создайте аккаунт чтобы бронировать вещи</p>

        <form method="POST" action="/register">
            <div style="margin-bottom:14px">
                <label>Имя и фамилия</label>
                <input type="text" name="name" class="input" style="width:100%"
                       placeholder="Иванов Иван" value="{{ name or '' }}" required>
            </div>
            <div style="margin-bottom:14px">
                <label>Email</label>
                <input type="email" name="email" class="input" style="width:100%"
                       placeholder="ivan@example.com" value="{{ email or '' }}" required>
            </div>
            <div style="margin-bottom:14px">
                <label>Пароль <span class="muted">(минимум 6 символов)</span></label>
                <input type="password" name="password" class="input" style="width:100%"
                       placeholder="••••••" required>
            </div>
            <div style="margin-bottom:24px">
                <label>Повторите пароль</label>
                <input type="password" name="password2" class="input" style="width:100%"
                       placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                Создать аккаунт
            </button>
        </form>

        <p style="text-align:center;margin-top:16px;font-size:14px" class="muted">
            Уже есть аккаунт?
            <a href="/login" style="color:var(--black);font-weight:600">Войти</a>
        </p>
    </div>
</div>

{% endblock %}
