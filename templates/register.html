{% extends "base.html" %}
{% block title %}Регистрация — ГикКульт{% endblock %}
{% block content %}
<div class="gc-auth">
    <div class="card">
        <div class="card-body">
            <h1>Создать аккаунт</h1>
            <p class="gc-sub">Чтобы бронировать имущество клуба в один клик</p>

            <form method="POST" action="{{ url_for('main.register') }}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="full_name">Имя и фамилия</label>
                    <input type="text" class="form-control" id="full_name" name="full_name"
                           value="{{ full_name or '' }}" placeholder="Иван Иванов" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Логин</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ username or '' }}" placeholder="ivanov" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Минимум 6 символов" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password2">Повторите пароль</label>
                    <input type="password" class="form-control" id="password2" name="password2"
                           autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-gc w-100">Зарегистрироваться</button>
            </form>

            <p class="text-muted mt-4 mb-0 text-center" style="font-size:.9rem">
                Уже есть аккаунт? <a href="{{ url_for('main.login') }}">Войти</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
