{# Кнопки брони/возврата. Ожидает переменную item #}
{% if item.is_taken %}
    {% if item.taken_by(current_user) %}
        <form method="POST" action="{{ url_for('main.return_item', item_id=item.id) }}" class="d-inline">
            <button type="submit" class="btn btn-gc-ghost btn-sm">Вернуть</button>
        </form>
    {% elif current_user.is_authenticated and current_user.is_admin %}
        <form method="POST" action="{{ url_for('main.return_item', item_id=item.id) }}" class="d-inline">
            <button type="submit" class="btn btn-gc-ghost btn-sm">Вернуть на место</button>
        </form>
    {% else %}
        <button class="btn btn-gc btn-sm" disabled>Занято</button>
    {% endif %}
{% elif current_user.is_authenticated %}
    <form method="POST" action="{{ url_for('main.book_item', item_id=item.id) }}" class="d-inline">
        <button type="submit" class="btn btn-gc btn-sm">Забронировать</button>
    </form>
{% else %}
    <a href="{{ url_for('main.login', next=request.path) }}" class="btn btn-gc btn-sm">Войти и взять</a>
{% endif %}
